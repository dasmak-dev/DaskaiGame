  <script>
    // Aplica tema y tamaño de texto antes de pintar para evitar parpadeos
    try {
      var s = JSON.parse(localStorage.getItem('daskai.settings') || '{}');
      var d = document.documentElement;
      d.dataset.theme = s.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      d.dataset.textsize = s.textSize || 'md';
      var st = s.styleV ? (s.uiStyle || 'exile') : (s.uiStyle === 'classic' ? 'classic' : 'exile');
      d.dataset.style = st === 'classic' ? 'classic' : 'clean';
      d.dataset.skin = st === 'exile' ? 'exile' : 'none';
    } catch (e) {}
  </script>

    ORDEN DE CARGA (importa: cada capa usa las anteriores)
    1. core       → base reutilizable (sin lógica de juego)
    2. lang       → textos de la interfaz
    3. data       → datos editables del juego
    4. systems    → reglas y lógica (sin interfaz)
    5. components → piezas visuales compartidas
    6. screens    → pantallas (cada una registra su entrada de menú)
    7. main.js    → arranque
